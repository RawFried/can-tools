[workspace]
members = ["crates/can-core", "crates/canalyst-ii"]
resolver = "2"

[package]
name = "can-tools"
version = "0.4.6"
edition = "2021"
rust-version = "1.82"
description = "Web host for Chuangxin USBCAN/CANalyst-II (04d8:0053): baud rate, filters, frame recording"
license = "MIT"
repository = "https://github.com/example/can-tools"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
can-core = { path = "crates/can-core" }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketcan = { version = "3.6.2", default-features = false, features = ["netlink"] }
tokio = { version = "1", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
canalyst-ii = { path = "crates/canalyst-ii" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
