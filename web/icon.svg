<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CAN Tools">
  <!-- 纸面方标：右下小切角，与界面按钮同一语言（切角处透明白） -->
  <path d="M0 0h512v392L392 512H0Z" fill="#F4F4F2"/>
  <!-- 差分对残段：真实 CAN 的另一条线，信号向切角处衰减 -->
  <path d="M40 172h216" stroke="#161616" stroke-width="20"/>
  <path d="M300 172h40" stroke="#161616" stroke-width="20"/>
  <path d="M368 172h72" stroke="#161616" stroke-width="20" stroke-dasharray="30 22"/>
  <!-- 总线：一条粗墨线贯穿 -->
  <path d="M40 288h400" stroke="#161616" stroke-width="30"/>
  <!-- 三个节点同一外框：实装 / 正在收发（黄）/ 空位 -->
  <rect x="76" y="249" width="78" height="78" fill="#161616"/>
  <rect x="196" y="249" width="78" height="78" fill="#FFFA00" stroke="#161616" stroke-width="16"/>
  <rect x="316" y="249" width="78" height="78" fill="#F4F4F2" stroke="#161616" stroke-width="16"/>
</svg>
