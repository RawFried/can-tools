<div id="toasts" role="status" aria-live="polite"></div>

<template id="rowTpl">
  <tr><td class="c-seq"></td><td class="c-time"></td><td class="c-ch"></td><td class="c-id"></td><td class="c-type"></td><td class="c-dlc"></td><td class="c-data"></td></tr>
</template>

<template id="recRowTpl">
  <li class="rec-item">
    <div class="rec-meta">
      <div class="r-name"></div>
      <div class="rec-item-sub"><span class="r-size"></span><span class="r-time"></span></div>
    </div>
    <div class="r-act">
      <a class="ui-btn small" href="#" download><span>下载</span></a>
      <button class="ui-btn small danger" type="button"><span>删除</span></button>
    </div>
  </li>
</template>

<template id="filterRowTpl">
  <div class="filter-row">
    <div class="f-line f-kind">
      <div class="ui-seg" role="radiogroup" aria-label="帧类型">
        <label><input type="radio" value="std" checked><span>标准</span></label>
        <label><input type="radio" value="ext"><span>扩展</span></label>
      </div>
    </div>
    <div class="f-line f-range">
      <span class="hex"><input class="input f-start" type="text" autocomplete="off" spellcheck="false" value="100" aria-label="起始 ID（十六进制）"></span>
      <span class="f-sep">–</span>
      <span class="hex"><input class="input f-end" type="text" autocomplete="off" spellcheck="false" value="7FF" aria-label="结束 ID（十六进制）"></span>
      <button class="ui-btn small icon-only f-del" type="button" aria-label="删除此 ID 区间"><span>×</span></button>
    </div>
  </div>
</template>

<!-- 信号曲线：通道选择弹窗（窗口容器见文件末尾） -->
<div class="signal-modal" id="signalModal" hidden>
  <div class="signal-modal-backdrop" data-signal-close aria-hidden="true"></div>
  <section class="ui-panel signal-modal-panel" role="dialog" aria-modal="true" aria-labelledby="h-signal-picker">
    <header class="panel-head signal-modal-head">
      <h2 class="ui-pair" id="h-signal-picker"><span class="ui-eyebrow slash">Signal / Channel</span><span>选择信号曲线通道</span></h2>
      <span class="head-spacer"></span>
      <button class="ui-btn small icon-only" id="btnSignalModalClose" type="button" aria-label="关闭通道选择">
        <span>×</span>
      </button>
    </header>
    <p class="signal-modal-hint">选择通道后为其打开独立的信号曲线浮窗；每个通道单独加载 DBC，可同时打开多个窗口。</p>
    <div class="signal-picker" id="signalPickerList" role="group" aria-label="可用通道"></div>
    <p class="empty-inline signal-picker-empty" id="signalPickerEmpty" hidden></p>
  </section>
</div>

<div class="signal-windows" id="signalWindows" role="region" aria-label="信号曲线浮窗"></div>

<noscript><div class="noscript">此页面需要启用 JavaScript 才能与 CAN 服务通信。</div></noscript>
