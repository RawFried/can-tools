<div id="toasts" role="status" aria-live="polite"></div>

<template id="rowTpl">
  <tr><td class="c-seq"></td><td class="c-time"></td><td class="c-ch"></td><td class="c-id"></td><td class="c-type"></td><td class="c-dlc"></td><td class="c-data"></td></tr>
</template>

<template id="recRowTpl">
  <li class="rec-item">
    <div class="rec-meta">
      <div class="r-name"></div>
      <div class="rec-item-sub"><span class="r-size"></span><span class="r-time"></span></div>
    </div>
    <div class="r-act">
      <a class="ef-btn small" href="#" download><span>下载</span></a>
      <button class="ef-btn small danger" type="button"><span>删除</span></button>
    </div>
  </li>
</template>

<template id="filterRowTpl">
  <div class="filter-row">
    <div class="f-line f-kind">
      <div class="ef-seg" role="radiogroup" aria-label="帧类型">
        <label><input type="radio" value="std" checked><span>标准</span></label>
        <label><input type="radio" value="ext"><span>扩展</span></label>
      </div>
    </div>
    <div class="f-line f-range">
      <span class="hex"><input class="input f-start" type="text" autocomplete="off" spellcheck="false" value="100" aria-label="起始 ID（十六进制）"></span>
      <span class="f-sep">–</span>
      <span class="hex"><input class="input f-end" type="text" autocomplete="off" spellcheck="false" value="7FF" aria-label="结束 ID（十六进制）"></span>
      <button class="ef-btn small icon-only f-del" type="button" aria-label="删除此 ID 区间"><span>×</span></button>
    </div>
  </div>
</template>

<noscript><div class="noscript">此页面需要启用 JavaScript 才能与 CAN 服务通信。</div></noscript>
