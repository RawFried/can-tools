    <!-- 数据区：实时报文（信号曲线已独立为按通道浮窗） -->
    <section class="ef-panel panel-data" id="framesPanel" aria-labelledby="h-frames">
      <header class="panel-head data-head">
        <h2 class="ef-pair" id="h-frames"><span class="ef-eyebrow slash">05 / Frames</span><span>实时报文</span></h2>
      </header>

      <div class="frames-tools">
        <div class="tools">
          <div class="ef-seg frame-mode" role="radiogroup" aria-label="报文显示方式">
            <label><input type="radio" name="frame-mode" id="frameModeStream" value="stream" checked><span>流水线</span></label>
            <label><input type="radio" name="frame-mode" id="frameModeChanges" value="changes"><span>变化汇总</span></label>
          </div>
          <label class="search">
            <input type="search" id="frameFilter" placeholder="过滤 ID / 数据 / 通道（按 / 聚焦）" aria-label="快速过滤报文">
          </label>
          <label class="switch" title="开启时始终跟随最新报文；关闭后可向上查看历史"><input class="ef-switch" type="checkbox" id="autoscrollCheck" checked><span>自动滚动</span></label>
          <button class="ef-btn small btn-press" id="btnPauseView" type="button" aria-pressed="false" disabled title="暂停或恢复显示（不影响接收与录制）">
            <span id="btnPauseLabel">暂停显示</span>
          </button>
          <button class="ef-btn small" id="btnClearView" type="button" title="清空实时缓冲（不影响录制文件）">
            <span>清空</span>
          </button>
        </div>
      </div>
      <div class="table-area">
        <div class="table-wrap" id="tableWrap" tabindex="0" aria-label="报文列表，区域可滚动">
          <table class="frames">
            <caption class="sr-only">实时 CAN 报文</caption>
            <colgroup>
              <col style="width:88px"><col style="width:118px"><col style="width:124px"><col style="width:134px"><col style="width:92px"><col style="width:52px"><col style="width:100%">
            </colgroup>
            <thead>
              <tr><th class="num" scope="col">序列</th><th scope="col">时间</th><th scope="col">通道</th><th scope="col">ID</th><th scope="col">类型</th><th class="num" scope="col">DLC</th><th scope="col">数据</th></tr>
            </thead>
            <tbody id="framesBody"></tbody>
          </table>
        </div>
        <div class="empty" id="frameEmpty">
          <p class="t" id="emptyTitle">等待报文</p>
          <p class="h" id="emptyHint">在左侧选择通道并点击「启动通道」，捕获的报文将显示在这里。</p>
        </div>
        <div class="paused-badge" id="pausedBadge" hidden>已暂停 <span id="pausedCount">0</span> 帧未显示</div>
      </div>
      <footer class="strip">
        <span class="log" id="lastLogMsg">就绪</span>
        <span class="strip-right"><span id="visibleCount">显示 0 行</span><span id="bufferUsage">缓冲 0 / 5,000</span></span>
      </footer>
    </section>
