    <section class="card panel-channel-stats" aria-labelledby="h-channel-stats">
      <header class="card-head">
        <span class="card-index">HUD</span>
        <h2 id="h-channel-stats">通道统计</h2>
        <span class="head-spacer"></span>
        <span class="stats-note">每秒刷新</span>
      </header>
      <div class="channel-stats-wrap">
        <table class="channel-stats-table">
          <caption class="sr-only">运行中通道的帧率与总线负载</caption>
          <colgroup>
            <col style="width:26%"><col style="width:18%"><col style="width:18%"><col style="width:24%"><col style="width:14%">
          </colgroup>
          <thead>
            <tr><th scope="col">通道</th><th scope="col">速率</th><th class="num" scope="col">帧率</th><th scope="col">总线负载</th><th class="num" scope="col">累计接收</th></tr>
          </thead>
          <tbody id="channelStatsBody"></tbody>
        </table>
        <div class="empty-inline" id="channelStatsEmpty">暂无运行中的通道；启动后显示帧率与总线负载。</div>
      </div>
      <p class="hint channel-stats-hint">负载按经典 CAN 帧位数估算（不含位填充），包含被软件滤波丢弃的帧。</p>
    </section>
