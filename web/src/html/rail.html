  <aside class="rail" aria-label="配置面板">

    <section class="ef-panel" aria-labelledby="h-chan">
      <header class="panel-head">
        <h2 class="ef-pair" id="h-chan"><span class="ef-eyebrow slash">01 / Channel</span><span>通道</span></h2>
        <span class="head-spacer"></span>
        <button class="ef-btn small" id="btnRefreshDevices" type="button" title="同时扫描 USBCAN 设备与 SocketCAN 接口">
          <span>刷新设备与链路</span>
        </button>
      </header>
      <div class="ef-form">
        <div class="field">
          <label class="field-label" id="lb-ch" for="channelSelect">选择通道</label>
          <select class="input" id="channelSelect" aria-label="选择要配置的通道"></select>
        </div>
        <div class="channel-state" id="channelState">已停止</div>
        <div class="field">
          <label class="field-label" for="channelRate">速率</label>
          <select class="input" id="channelRate">
            <option value="5k">5 kbps</option>
            <option value="10k">10 kbps</option>
            <option value="20k">20 kbps</option>
            <option value="50k">50 kbps</option>
            <option value="100k">100 kbps</option>
            <option value="125k">125 kbps</option>
            <option value="250k">250 kbps</option>
            <option value="500k" selected>500 kbps</option>
            <option value="800k">800 kbps</option>
            <option value="1000k">1000 kbps</option>
          </select>
        </div>
        <div class="btn-row">
          <button class="ef-btn go" id="btnChannelStart" type="button" disabled><span>启动通道</span></button>
          <button class="ef-btn" id="btnChannelStop" type="button" disabled><span>停止通道</span></button>
        </div>
        <div class="field" id="modeField">
          <span class="field-label" id="lb-mode">工作模式（USB）</span>
          <div class="ef-seg" role="radiogroup" aria-labelledby="lb-mode">
            <label><input type="radio" name="mode" value="normal" checked><span>正常</span></label>
            <label><input type="radio" name="mode" value="listen_only"><span>只听</span></label>
            <label><input type="radio" name="mode" value="self_test"><span>自测</span></label>
          </div>
        </div>

        <div class="panel-section" role="group" aria-labelledby="h-filter">
          <h3 class="ef-pair" id="h-filter"><span class="ef-eyebrow slash">Filter</span><span>滤波器</span></h3>
          <div class="field">
            <div id="filterRangeList" role="group" aria-label="ID 区间"></div>
            <div class="empty-inline filter-empty" id="filterEmpty">未添加 ID 区间 —— 该通道将接收全部帧。</div>
          </div>
          <div class="btn-row">
            <button class="ef-btn small" id="btnAddFilter" type="button">
              <span>添加 ID 区间</span>
            </button>
            <button class="ef-btn small" id="btnAcceptAll" type="button" title="清空当前通道的 ID 区间（应用后该通道接收所有帧）"><span>接收全部</span></button>
            <button class="ef-btn small" id="btnApplyFilters" type="button" disabled><span>实时应用滤波</span></button>
          </div>
        </div>
      </div>
    </section>

<!-- include: recordings.html -->

  </aside>
