<header class="ef-cmdbar">
  <span class="brand"><span class="seal" aria-hidden="true">C</span>CAN TOOLS</span>
  <div class="util topbar-status">
    <button class="ef-btn small signal-open" id="btnOpenSignals" type="button" title="为通道打开独立的信号曲线浮窗">
      <span>信号曲线</span>
    </button>
    <span class="cm-field" id="devicePill" title="设备连接状态">
      <span class="cm-dot" id="devicePillDot"></span><span class="txt" id="devicePillText">未连接设备</span>
    </span>
    <span class="cm-field" id="recPill" hidden title="正在录制 CSV">
      <span class="cm-dot rec" aria-hidden="true"></span><span class="txt">录制中</span>
    </span>
    <span class="cm-field" id="wsPill" title="与服务端的数据链路（WebSocket）状态">
      <span class="cm-dot warn" id="wsDot"></span><span class="txt" id="wsText">连接中…</span>
    </span>
    <span class="cm-field cm-ver" id="versionLabel">v—</span>
  </div>
</header>
