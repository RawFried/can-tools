    <section class="card panel-logs" aria-labelledby="h-logs">
      <header class="card-head">
        <span class="card-index">04</span><h2 id="h-logs">运行日志</h2>
        <span class="count-badge" id="logsCount">0</span>
        <span class="head-spacer"></span>
        <button class="btn btn-sm" id="btnRefreshLogs" type="button" title="重新加载日志文件列表">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></svg>
          <span>刷新</span>
        </button>
      </header>
      <div class="recs-wrap">
        <table class="recs-table">
          <caption class="sr-only">服务端运行日志文件</caption>
          <colgroup>
            <col style="width:100%"><col style="width:96px"><col style="width:176px"><col style="width:96px">
          </colgroup>
          <thead>
            <tr><th scope="col">文件名</th><th class="num c-size" scope="col">大小</th><th class="c-time" scope="col">修改时间</th><th class="right" scope="col">操作</th></tr>
          </thead>
          <tbody id="logsList"></tbody>
        </table>
        <div class="empty-inline" id="logsEmpty">暂无日志文件；服务启动后会自动创建。</div>
      </div>
      <p class="hint logs-hint">目录：<code id="logsDir">—</code> · 单文件 8 MB，保留当前 + 3 个轮转文件</p>
    </section>

    <template id="logRowTpl">
      <tr>
        <td class="r-name"></td>
        <td class="r-size num"></td>
        <td class="r-time"></td>
        <td class="r-act">
          <a class="btn btn-sm" href="#" download>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10m0 0-4-4m4 4 4-4M5 19h14"/></svg>
            <span>下载</span>
          </a>
        </td>
      </tr>
    </template>
