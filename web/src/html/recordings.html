    <section class="ef-panel" aria-labelledby="h-files">
      <header class="panel-head">
        <h2 class="ef-pair" id="h-files"><span class="ef-eyebrow slash">02 / Recording</span><span>录制</span></h2>
        <span class="ef-field" id="recordingsCount">0</span>
        <span class="head-spacer"></span>
        <button class="ef-btn small" id="btnRefreshRecordings" type="button">
          <span>刷新</span>
        </button>
      </header>
      <div class="rec-toolbar ef-form">
        <div class="rec-actions">
          <button class="ef-btn go" id="btnRecStart" type="button" disabled>
            <span>开始录制</span>
          </button>
          <button class="ef-btn" id="btnRecStop" type="button" disabled><span>停止并保存</span></button>
        </div>
        <div class="rec-active" id="recActive" hidden aria-live="polite">
          <span class="rec-live">
            <span class="rec-dot" aria-hidden="true"></span>
            <span class="rec-file" id="recActiveFile">—</span>
          </span>
          <span class="rec-stats">
            <span class="rec-stat">已录 <span class="rec-num" id="recActiveFrames">0</span> 帧</span>
            <span class="rec-stat">时长 <span class="rec-num" id="recActiveElapsed">00:00</span></span>
          </span>
        </div>
        <div class="rec-dir">
          <label class="field-label" for="dataDirInput">CSV 目录</label>
          <div class="rec-dir-row">
            <input class="input rec-path-input" id="dataDirInput" type="text" spellcheck="false" autocomplete="off" placeholder="留空使用默认目录" aria-label="CSV 保存目录（绝对路径，清空恢复默认）">
            <button class="ef-btn small" id="btnApplyDir" type="button">应用</button>
          </div>
        </div>
      </div>
      <div class="recs-wrap" id="recordingsWrap" tabindex="-1" role="region" aria-label="已保存的 CSV 录制文件列表（最多显示 5 个，可滚动）">
        <ul class="recs-list" id="recordingsList"></ul>
        <div class="empty-inline" id="recordingsEmpty" hidden>暂无录制文件。点击「开始录制」开始采集。</div>
      </div>
    </section>
