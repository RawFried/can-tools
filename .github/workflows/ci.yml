name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend (app.js + app.css)
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run test
          # 两个产物均由 web/src/** 构建并跟踪提交：app.js 来自 src/main.ts，
          # app.css 来自 src/styles/index.css；任一不同步即失败。
          git diff --exit-code -- web/app.js web/app.css
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  appimage:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build AppImage
        run: SKIP_BUILD=1 ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: can-tools-appimage
          path: dist/*.AppImage
