name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run test
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets

  deb:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      # 说明: CI 用本机工具链打 deb（适合当前 Ubuntu）；面向旧发行版/其他架构请用
      # `./packaging/build-deb.sh`（默认 zigbuild，glibc 2.17）或 `ARCH=arm64 ...`。
      - name: Build deb
        run: ZIG=0 ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: can-tools-deb
          path: dist/*.deb
