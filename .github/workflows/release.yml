name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Verify tag matches Cargo version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 Cargo.toml 版本 v${version} 不一致"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check, test and build frontend
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run test
          npm run build

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build deb
        env:
          ZIG: '0'
          SKIP_BUILD: '1'
          BIN: target/release/can-tools
        run: ./packaging/build-deb.sh

      - name: Build AppImage
        env:
          SKIP_BUILD: '1'
        run: ./packaging/build-appimage.sh

      - name: Write checksums
        run: |
          cd dist
          sha256sum ./*.deb ./*.AppImage > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/*.deb dist/*.AppImage dist/SHA256SUMS --clobber
          else
            gh release create "${tag}" \
              dist/*.deb dist/*.AppImage dist/SHA256SUMS \
              --title "CAN Tools ${tag#v}" \
              --generate-notes \
              --latest
          fi
